name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      # The platform branches are the point of the matrix: a red Windows job must
      # not cancel the Ubuntu one, or the failure that matters stays unseen.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
